name: Windows Rust build and tests
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Resolve dependencies
        run: cargo generate-lockfile
      - name: Unit tests
        run: cargo test --all-targets --locked
      - name: Build CLI and windowless agent
        run: cargo build --release --locked
      - name: Verify executable names
        shell: pwsh
        run: |
          if (!(Test-Path target/release/habits.exe)) { throw 'Missing habits.exe' }
          if (!(Test-Path target/release/habagent.exe)) { throw 'Missing habagent.exe' }
          if (Test-Path target/release/habits-agent.exe) { throw 'Legacy agent binary exists' }
